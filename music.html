<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guitar Training Application</title>

    <style>

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }



        body {

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

            min-height: 100vh;

            padding: 20px;

            color: #333;

        }



        .container {

            max-width: 1400px;

            margin: 0 auto;

            background: white;

            border-radius: 20px;

            box-shadow: 0 20px 60px rgba(0,0,0,0.3);

            padding: 30px;

        }



        h1 {

            text-align: center;

            color: #667eea;

            margin-bottom: 30px;

            font-size: 2.5em;

        }



        .controls {

            display: grid;

            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));

            gap: 20px;

            margin-bottom: 30px;

            padding: 20px;

            background: #f8f9fa;

            border-radius: 10px;

        }



        .control-group {

            display: flex;

            flex-direction: column;

        }



        .control-group label {

            font-weight: bold;

            margin-bottom: 8px;

            color: #555;

        }



        .control-group select,

        .control-group button {

            padding: 10px;

            border: 2px solid #ddd;

            border-radius: 5px;

            font-size: 16px;

            background: white;

            cursor: pointer;

        }



        .control-group select:hover,

        .control-group button:hover {

            border-color: #667eea;

        }



        .control-group button {

            background: #667eea;

            color: white;

            border: none;

            font-weight: bold;

            transition: background 0.3s;

        }



        .control-group button:hover {

            background: #5568d3;

        }



        .scale-info {

            background: #e8f4f8;

            padding: 20px;

            border-radius: 10px;

            margin-bottom: 30px;

            border-left: 5px solid #667eea;

        }



        .scale-info h2 {

            color: #667eea;

            margin-bottom: 10px;

        }



        .scale-alterations {

            font-size: 1.2em;

            font-weight: bold;

            color: #555;

            margin-top: 10px;

        }



        .exercise-info {

            background: #fff3cd;

            padding: 20px;

            border-radius: 10px;

            margin-bottom: 30px;

            border-left: 5px solid #ffc107;

        }



        .exercise-info h2 {

            color: #856404;

            margin-bottom: 10px;

        }



        .exercise-details {

            display: grid;

            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));

            gap: 15px;

            margin-top: 15px;

        }



        .exercise-detail {

            padding: 10px;

            background: white;

            border-radius: 5px;

            border: 1px solid #ffc107;

        }



        .exercise-detail strong {

            color: #856404;

        }



        .fretboard-container {

            overflow-x: auto;

            margin-bottom: 30px;

            padding: 20px;

            background: #f8f9fa;

            border-radius: 10px;

        }



        .fretboard {

            display: flex;

            flex-direction: column;

            gap: 8px;

            min-width: 800px;

            margin: 0 auto;

        }



        .string {

            display: flex;

            align-items: center;

            position: relative;

        }



        .string-label {

            width: 40px;

            font-weight: bold;

            text-align: center;

            color: #555;

        }



        .frets {

            display: flex;

            flex: 1;

            position: relative;

        }



        .fret {

            flex: 1;

            height: 50px;

            border-right: 3px solid #333;

            display: flex;

            align-items: center;

            justify-content: center;

            position: relative;

            background: #fafafa;

        }



        .fret:first-child {

            border-left: 3px solid #333;

        }



        .fret-label {

            position: absolute;

            top: -25px;

            left: 50%;

            transform: translateX(-50%);

            font-size: 12px;

            color: #666;

            font-weight: bold;

        }



        .note {

            width: 35px;

            height: 35px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-weight: bold;

            font-size: 14px;

            color: white;

            cursor: pointer;

            transition: transform 0.2s;

        }



        .note:hover {

            transform: scale(1.1);

        }



        .note.root {

            background: #dc3545;

        }



        .note.scale {

            background: #667eea;

        }



        .note.exercise {

            background: #28a745;

            border: 3px solid #155724;

        }



        .note.exercise.root {

            background: #ffc107;

            border: 3px solid #856404;

            color: #333;

        }



        .fret-number {

            position: absolute;

            bottom: -20px;

            left: 50%;

            transform: translateX(-50%);

            font-size: 11px;

            color: #999;

        }



        .notes-display {

            margin-top: 20px;

            padding: 15px;

            background: white;

            border-radius: 5px;

            border: 1px solid #ddd;

        }



        .notes-display h3 {

            margin-bottom: 10px;

            color: #667eea;

        }



        .notes-list {

            overflow-x: auto;

            padding: 10px 0;

        }



        .notation-staff {

            display: block;

            min-width: min-content;

        }

    </style>

</head>

<body>

            <div class="control-group">

            <div class="control-group">

            </div>

        </div>



        <div class="scale-info">

            <h2 id="scale-name">Major (Ionian)</h2>

            <div class="scale-alterations" id="scale-alterations">1 2 3 4 5 6 7</div>

        </div>



        <div class="exercise-info">

            <h2>Current Exercise</h2>

            <div class="exercise-details">

                <div class="exercise-detail">

                    <strong>Pattern:</strong> <span id="ex-pattern">-</span>

                </div>

                <div class="exercise-detail">

                    <strong>Position:</strong> <span id="ex-position">-</span>

                </div>

                <div class="exercise-detail">

                    <strong>Direction:</strong> <span id="ex-direction">-</span>

                </div>

                <div class="exercise-detail">

                    <strong>Progression:</strong> <span id="ex-progression">-</span>

                </div>

        </div>



        <div class="fretboard-container">

            <div class="fretboard" id="fretboard"></div>

        </div>



        <div class="notes-display">

            <h3>Exercise Notes Sequence</h3>

            <div class="notes-list" id="notes-sequence"></div>

        </div>



        <div class="notes-display" style="margin-top: 1em;">

            <h3>Notation tests</h3>

            <button type="button" id="run-notation-tests">Run notation tests</button>

            <pre id="notation-test-results" style="margin-top: 10px; padding: 10px; background: #f5f5f5; min-height: 40px;"></pre>

        </div>

    </div>



    <script src="https://cdn.jsdelivr.net/npm/vexflow@4/releases/vexflow-min.js"></script>

    <script>

        // Chromatic notes

        const chromaticNotes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

        

        // Standard guitar tuning (E2, A2, D3, G3, B3, E4)

        const guitarStrings = [

            { note: 'E', octave: 2, index: 4 },

            { note: 'A', octave: 2, index: 9 },

            { note: 'D', octave: 3, index: 2 },

            { note: 'G', octave: 3, index: 7 },

            { note: 'B', octave: 3, index: 11 },

            { note: 'E', octave: 4, index: 4 }

        ];



        // Scale definitions with alterations

        const scales = {

            'major': {

                name: 'Major (Ionian)',

                intervals: [0, 2, 4, 5, 7, 9, 11],

                alterations: '1 2 3 4 5 6 7'

            },

            'dorian': {

                name: 'Dorian',

                intervals: [0, 2, 3, 5, 7, 9, 10],

                alterations: '1 2 b3 4 5 6 b7'

            },

            'phrygian': {

                name: 'Phrygian',

                intervals: [0, 1, 3, 5, 7, 8, 10],

                alterations: '1 b2 b3 4 5 b6 b7'

            },

            'lydian': {

                name: 'Lydian',

                intervals: [0, 2, 4, 6, 7, 9, 11],

                alterations: '1 2 3 #4 5 6 7'

            },

            'mixolydian': {

                name: 'Mixolydian',

                intervals: [0, 2, 4, 5, 7, 9, 10],

                alterations: '1 2 3 4 5 6 b7'

            },

            'aeolian': {

                name: 'Aeolian (Natural Minor)',

                intervals: [0, 2, 3, 5, 7, 8, 10],

                alterations: '1 2 b3 4 5 b6 b7'

            },

            'locrian': {

                name: 'Locrian',

                intervals: [0, 1, 3, 5, 6, 8, 10],

                alterations: '1 b2 b3 4 b5 b6 b7'

            },

            'harmonic-minor': {

                name: 'Harmonic Minor',

                intervals: [0, 2, 3, 5, 7, 8, 11],

                alterations: '1 2 b3 4 5 b6 7'

            },

            'melodic-minor': {

                name: 'Melodic Minor',

                intervals: [0, 2, 3, 5, 7, 9, 11],

                alterations: '1 2 b3 4 5 6 7'

            },

            'lydian-dominant': {

                name: 'Lydian Dominant',

                intervals: [0, 2, 4, 6, 7, 9, 10],

                alterations: '1 2 3 #4 5 6 b7'

            },

            'whole-tone': {

                name: 'Whole Tone',

                intervals: [0, 2, 4, 6, 8, 10],

                alterations: '1 2 3 #4 #5 #6'

            },

            'pentatonic-major': {

                name: 'Pentatonic Major',

                intervals: [0, 2, 4, 7, 9],

                alterations: '1 2 3 5 6'

            },

            'pentatonic-minor': {

                name: 'Pentatonic Minor',

                intervals: [0, 3, 5, 7, 10],

                alterations: '1 b3 4 5 b7'

            }

        };



        // Get note name from chromatic index

        function getNoteName(index) {

            return chromaticNotes[index % 12];

        }



        // Get chromatic index from note name

        function getNoteIndex(note) {

            return chromaticNotes.indexOf(note);

        }



        // Assign octaves to a sequence of note names (2 octaves, root at 4)

        function assignOctavesToSequence(noteNames, rootKey) {

            if (noteNames.length === 0) return [];

            const out = [];

            let octave = 4;

            let prevIdx = getNoteIndex(noteNames[0]);

            for (let i = 0; i < noteNames.length; i++) {

                const idx = getNoteIndex(noteNames[i]);

                if (i > 0) {

                    if (prevIdx > idx && prevIdx - idx >= 7) octave++;  // wrapped 11->0 up

                    if (idx > prevIdx && idx - prevIdx >= 7) octave--;  // wrapped 0->11 down

                }

                octave = Math.max(3, Math.min(5, octave));

                out.push({ name: noteNames[i], octave });

                prevIdx = idx;

            }

            return out;

        }



        // (noteName, octave) -> MIDI number (C4 = 60)

        function toMidi(name, octave) {

            return 60 + (octave - 4) * 12 + getNoteIndex(name);

        }



        // Generate scale notes for a given key and scale

        function generateScale(key, scaleType) {

            const scale = scales[scaleType];

            const rootIndex = getNoteIndex(key);

            return scale.intervals.map(interval => getNoteName(rootIndex + interval));

        }



        // Find notes on fretboard within a position

        function findNotesOnFretboard(key, scaleType, position) {

            const scaleNotes = generateScale(key, scaleType);

            const notes = [];

            const startFret = (position - 1) * 4;

            const endFret = startFret + 12;



            guitarStrings.forEach((string, stringIndex) => {

                for (let fret = startFret; fret <= endFret && fret <= 24; fret++) {

                    const noteIndex = (string.index + fret) % 12;

                    const noteName = chromaticNotes[noteIndex];

                    if (scaleNotes.includes(noteName)) {

                        notes.push({

                            string: stringIndex,

                            fret: fret,

                            note: noteName,

                            isRoot: noteName === key

                        });

                    }

                }

            });



            return notes;

        }



        // Generate exercise pattern

        function generateExercisePattern(scaleNotes, pattern, direction, progression) {

            let patternNotes = [];



            switch (pattern) {

                case '3-note':

                    patternNotes = generateNNoteRuns(scaleNotes, 3);

                    break;

                case '4-note':

                    patternNotes = generateNNoteRuns(scaleNotes, 4);

                    break;

                case '6-note':

                    patternNotes = generateNNoteRuns(scaleNotes, 6);

                    break;

                case 'thirds':

                    patternNotes = generateThirds(scaleNotes);

                    break;

                case 'triads':

                    patternNotes = generateTriads(scaleNotes);

                    break;

                case 'chords':

                    patternNotes = generateChords(scaleNotes);

                    break;

                case 'arpeggios':

                    patternNotes = generateArpeggios(scaleNotes);

                    break;

                case 'pivot-arpeggios':

                    patternNotes = generatePivotArpeggios(scaleNotes);

                    break;

                default:

                    patternNotes = scaleNotes.slice();

            }



            // Fwd/back alternating scale runs (e.g. CDE FED EFG AGF GAB CBA BCD EDC...)

            let result;

            if (direction === 'forward-backward-alt' || direction === 'backward-forward-alt') {

                const groupSize = pattern === '3-note' ? 3 : pattern === '4-note' ? 4 : pattern === '6-note' ? 6 : 3;

                result = generateFwdBackAlternatingRuns(scaleNotes, groupSize);

                if (direction === 'backward-forward-alt') {

                    result = result.slice().reverse();

                }

            } else {

                result = applyDirection(patternNotes, direction);

            }



            // Apply progression

            if (progression === 'down') {

                result = result.reverse();

            }



            return result;

        }



        function generateNNoteRuns(scaleNotes, n) {

            const runs = [];

            for (let i = 0; i <= scaleNotes.length - n; i++) {

                runs.push(...scaleNotes.slice(i, i + n));

            }

            return runs;

        }



        // Fwd/back alternating scale run: e.g. 3-note ascending in C = CDE FED EFG AGF GAB CBA BCD EDC...

        // Forward group = N ascending notes, back group = N descending from the next scale degree; step by 2 so groups overlap by 1.

        function generateFwdBackAlternatingRuns(scaleNotes, groupSize) {

            const len = scaleNotes.length;

            const extended = [...scaleNotes, ...scaleNotes, ...scaleNotes]; // 3 octaves so we have room

            const result = [];

            for (let i = 0; i < len; i += 2) {

                // Forward group: scale[i], scale[i+1], ...

                for (let k = 0; k < groupSize; k++) {

                    result.push(extended[i + k]);

                }

                // Back group: scale[i+groupSize], scale[i+groupSize-1], ..., scale[i+1]

                for (let k = groupSize; k >= 1; k--) {

                    result.push(extended[i + k]);

                }

            }

            return result;

        }



        function generateThirds(scaleNotes) {

            const thirds = [];

            for (let i = 0; i < scaleNotes.length; i++) {

                thirds.push(scaleNotes[i]);

                thirds.push(scaleNotes[(i + 2) % scaleNotes.length]);

            }

            return thirds;

        }



        function generateTriads(scaleNotes) {

            const triads = [];

            for (let i = 0; i < scaleNotes.length; i++) {

                triads.push(scaleNotes[i]);

                triads.push(scaleNotes[(i + 2) % scaleNotes.length]);

                triads.push(scaleNotes[(i + 4) % scaleNotes.length]);

            }

            return triads;

        }



        function generateChords(scaleNotes) {

            // Similar to triads but can be extended

            return generateTriads(scaleNotes);

        }



        function generateArpeggios(scaleNotes) {

            const arpeggios = [];

            for (let i = 0; i < scaleNotes.length; i++) {

                arpeggios.push(scaleNotes[i]);

                arpeggios.push(scaleNotes[(i + 2) % scaleNotes.length]);

                arpeggios.push(scaleNotes[(i + 4) % scaleNotes.length]);

                arpeggios.push(scaleNotes[(i + 6) % scaleNotes.length]);

            }

            return arpeggios;

        }



        function generatePivotArpeggios(scaleNotes) {

            const arpeggios = [];

            for (let i = 0; i < scaleNotes.length; i++) {

                arpeggios.push(scaleNotes[i]);

                arpeggios.push(scaleNotes[(i + 2) % scaleNotes.length]);

                arpeggios.push(scaleNotes[(i + 4) % scaleNotes.length]);

                arpeggios.push(scaleNotes[(i + 2) % scaleNotes.length]); // Pivot back

                arpeggios.push(scaleNotes[i]); // Return to root

            }

            return arpeggios;

        }



        function applyDirection(notes, direction) {

            switch (direction) {

                case 'forward':

                    return notes;

                case 'backward':

                    return notes.slice().reverse();

                case 'forward-backward':

                    return [...notes, ...notes.slice().reverse()];

                case 'backward-forward':

                    return [...notes.slice().reverse(), ...notes];

                case 'forward-backward-alt':

                    const alt1 = [];

                    for (let i = 0; i < notes.length; i++) {

                        alt1.push(notes[i]);

                        if (i < notes.length - 1) {

                            alt1.push(notes[notes.length - 2 - i]);

                        }

                    }

                    return alt1;

                case 'backward-forward-alt':

                    const reversed = notes.slice().reverse();

                    const alt2 = [];

                    for (let i = 0; i < reversed.length; i++) {

                        alt2.push(reversed[i]);

                        if (i < reversed.length - 1) {

                            alt2.push(reversed[reversed.length - 2 - i]);

                        }

                    }

                    return alt2;

                default:

                    return notes;

            }

        }



        // Render exercise with VexFlow (treble staff, 2 octaves). One stave per measure (4/4) to avoid "too many ticks".

        function renderNotation(container, noteNames, rootKey) {

            const notes = assignOctavesToSequence(noteNames, rootKey);

            if (notes.length === 0) return;

            const VF = typeof VexFlow !== 'undefined' ? VexFlow : (typeof Vex !== 'undefined' && Vex.Flow ? Vex.Flow : null);

            if (!VF) {

                container.innerHTML = '<p style="color:#856404;">VexFlow failed to load. Check network.</p>';

                return;

            }



            const vexId = 'vexflow-staff';

            container.innerHTML = '<div id="' + vexId + '"></div>';

            const NOTES_PER_MEASURE = 4;

            const chunks = [];

            for (let i = 0; i < notes.length; i += NOTES_PER_MEASURE) {

                chunks.push(notes.slice(i, i + NOTES_PER_MEASURE));

            }

            const numStaves = chunks.length;

            const width = Math.max(500, notes.length * 22 + 80);

            const height = Math.max(140, 80 + numStaves * 55);



            try {

                const { Factory } = VF;

                const vf = new Factory({ renderer: { elementId: vexId, width: width, height: height } });

                const score = vf.EasyScore();

                // One system per measure so the formatter never sees "too many ticks" across staves

                chunks.forEach((chunk) => {

                    const system = vf.System();

                    let noteStr = chunk.map(n => n.name + n.octave + '/q').join(', ');

                    const need = NOTES_PER_MEASURE - chunk.length;

                    if (need > 0) {

                        noteStr += (noteStr ? ', ' : '') + Array(need).fill('B4/q/r').join(', ');

                    }

                    const voice = score.voice(score.notes(noteStr, { stem: 'auto' }), { time: '4/4' });

                    const stave = system.addStave({ voices: [voice] });

                    stave.addClef('treble');

                    stave.addTimeSignature('4/4');

                });

                vf.draw();

            } catch (err) {

                container.innerHTML = '<p style="color:#856404;">Notation error: ' + (err.message || err) + '</p>';

            }

        }



        // ---------- Notation tests ----------

        function runNotationTests() {

            const out = document.getElementById('notation-test-results');

            const results = [];

            let passed = 0;

            let failed = 0;



            function assert(condition, message) {

                if (condition) {

                    results.push('PASS: ' + message);

                    passed++;

                } else {

                    results.push('FAIL: ' + message);

                    failed++;

                }

            }



            const C_MAJOR = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];

            function makeNotes(n) {

                const arr = [];

                for (let i = 0; i < n; i++) arr.push(C_MAJOR[i % 7]);

                return arr;

            }



            const container = document.createElement('div');

            container.style.position = 'absolute';

            container.style.left = '-9999px';

            container.style.top = '0';

            document.body.appendChild(container);



            try {

                // Test 1: 4 notes (one measure)

                container.innerHTML = '';

                renderNotation(container, makeNotes(4), 'C');

                const noError1 = container.textContent.indexOf('Too many ticks') === -1 && container.textContent.indexOf('Notation error') === -1;

                const hasContent1 = container.querySelector('#vexflow-staff') && container.querySelector('#vexflow-staff').children.length > 0;

                assert(noError1, '4 notes: no "Too many ticks" or "Notation error"');

                assert(hasContent1, '4 notes: notation rendered (staff has content)');



                // Test 2: 8 notes (two measures)

                container.innerHTML = '';

                renderNotation(container, makeNotes(8), 'C');

                const noError2 = container.textContent.indexOf('Too many ticks') === -1 && container.textContent.indexOf('Notation error') === -1;

                const hasContent2 = container.querySelector('#vexflow-staff') && container.querySelector('#vexflow-staff').children.length > 0;

                assert(noError2, '8 notes: no "Too many ticks" or "Notation error"');

                assert(hasContent2, '8 notes: notation rendered');



                // Test 3: 24 notes (six measures)

                container.innerHTML = '';

                renderNotation(container, makeNotes(24), 'C');

                const noError3 = container.textContent.indexOf('Too many ticks') === -1 && container.textContent.indexOf('Notation error') === -1;

                const hasContent3 = container.querySelector('#vexflow-staff') && container.querySelector('#vexflow-staff').children.length > 0;

                assert(noError3, '24 notes: no "Too many ticks" or "Notation error"');

                assert(hasContent3, '24 notes: notation rendered');



                // Test 4: 7 notes (incomplete last measure, should pad with rest)

                container.innerHTML = '';

                renderNotation(container, makeNotes(7), 'C');

                const noError4 = container.textContent.indexOf('Too many ticks') === -1 && container.textContent.indexOf('Notation error') === -1;

                const hasContent4 = container.querySelector('#vexflow-staff') && container.querySelector('#vexflow-staff').children.length > 0;

                assert(noError4, '7 notes (incomplete measure): no error');

                assert(hasContent4, '7 notes: notation rendered');

            } finally {

                document.body.removeChild(container);

            }



            results.unshift(passed + ' passed, ' + failed + ' failed');

            out.textContent = results.join('\n');

        }



        // Render fretboard

        function renderFretboard(key, scaleType, position, exerciseNotes) {

            const fretboard = document.getElementById('fretboard');

            fretboard.innerHTML = '';



            const scaleNotes = generateScale(key, scaleType);

            const fretboardNotes = findNotesOnFretboard(key, scaleType, position);

            const startFret = (position - 1) * 4;

            const endFret = Math.min(startFret + 12, 24);



            // Create fret labels

            const fretLabels = document.createElement('div');

            fretLabels.className = 'frets';

            fretLabels.style.marginBottom = '20px';

            for (let f = startFret; f <= endFret; f++) {

                const label = document.createElement('div');

                label.className = 'fret-label';

                label.textContent = f;

                label.style.position = 'absolute';

                label.style.left = `${((f - startFret) / (endFret - startFret + 1)) * 100}%`;

                fretLabels.appendChild(label);

            }

            fretboard.appendChild(fretLabels);



            // Create strings

            guitarStrings.forEach((string, stringIndex) => {

                const stringDiv = document.createElement('div');

                stringDiv.className = 'string';



                const label = document.createElement('div');

                label.className = 'string-label';

                label.textContent = `${string.note}${string.octave}`;

                stringDiv.appendChild(label);



                const fretsDiv = document.createElement('div');

                fretsDiv.className = 'frets';



                for (let fret = startFret; fret <= endFret; fret++) {

                    const fretDiv = document.createElement('div');

                    fretDiv.className = 'fret';

                    

                    const noteIndex = (string.index + fret) % 12;

                    const noteName = chromaticNotes[noteIndex];

                    const isInScale = scaleNotes.includes(noteName);

                    const isRoot = noteName === key;

                    const isInExercise = exerciseNotes && exerciseNotes.includes(noteName);



                    if (isInScale || isInExercise) {

                        const noteDiv = document.createElement('div');

                        noteDiv.className = 'note';

                        

                        if (isInExercise) {

                            noteDiv.classList.add('exercise');

                            if (isRoot) {

                                noteDiv.classList.add('root');

                            }

                        } else if (isRoot) {

                            noteDiv.classList.add('root');

                        } else {

                            noteDiv.classList.add('scale');

                        }



                        noteDiv.textContent = noteName;

                        noteDiv.title = `${noteName} - Fret ${fret}`;

                        fretDiv.appendChild(noteDiv);

                    }



                    if (fret === startFret) {

                        const fretNum = document.createElement('div');

                        fretNum.className = 'fret-number';

                        fretNum.textContent = fret;

                        fretDiv.appendChild(fretNum);

                    }



                    fretsDiv.appendChild(fretDiv);

                }



                stringDiv.appendChild(fretsDiv);

                fretboard.appendChild(stringDiv);

            });

        }



        // Update display

        function updateDisplay() {

            const key = document.getElementById('key').value;

            const scaleType = document.getElementById('scale').value;

            const pattern = document.getElementById('pattern').value;

            const position = parseInt(document.getElementById('position').value);

            const direction = document.getElementById('direction').value;

            const progression = document.getElementById('progression').value;



            // Update scale info

            const scale = scales[scaleType];

            document.getElementById('scale-name').textContent = `${key} ${scale.name}`;

            document.getElementById('scale-alterations').textContent = scale.alterations;



            // Update exercise info

            document.getElementById('ex-pattern').textContent = document.getElementById('pattern').selectedOptions[0].text;

            document.getElementById('ex-position').textContent = `${position}${getOrdinalSuffix(position)} Position`;

            document.getElementById('ex-direction').textContent = document.getElementById('direction').selectedOptions[0].text;

            document.getElementById('ex-progression').textContent = progression === 'up' ? 'Up' : 'Down';



            // Generate exercise notes

            const scaleNotes = generateScale(key, scaleType);

            const exerciseNotes = generateExercisePattern(scaleNotes, pattern, direction, progression);



            // Display exercise as notation

            const notesSequence = document.getElementById('notes-sequence');

            renderNotation(notesSequence, exerciseNotes, key);



            // Render fretboard

            renderFretboard(key, scaleType, position, exerciseNotes);

        }



        function getOrdinalSuffix(num) {

            const j = num % 10;

            const k = num % 100;

            if (j === 1 && k !== 11) return 'st';

            if (j === 2 && k !== 12) return 'nd';

            if (j === 3 && k !== 13) return 'rd';

            return 'th';

        }



        function randomExercise() {

            const keys = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

            const scaleTypes = Object.keys(scales);

            const patterns = ['3-note', '4-note', '6-note', 'thirds', 'triads', 'chords', 'arpeggios', 'pivot-arpeggios'];

            const positions = [1, 2, 3];

            const directions = ['forward', 'backward', 'forward-backward', 'backward-forward', 'forward-backward-alt', 'backward-forward-alt'];

            const progressions = ['up', 'down'];



            document.getElementById('key').value = keys[Math.floor(Math.random() * keys.length)];

            document.getElementById('scale').value = scaleTypes[Math.floor(Math.random() * scaleTypes.length)];

            document.getElementById('pattern').value = patterns[Math.floor(Math.random() * patterns.length)];

            document.getElementById('position').value = positions[Math.floor(Math.random() * positions.length)];

            document.getElementById('direction').value = directions[Math.floor(Math.random() * directions.length)];

            document.getElementById('progression').value = progressions[Math.floor(Math.random() * progressions.length)];



            updateDisplay();

        }



        // Event listeners

        document.getElementById('generate').addEventListener('click', updateDisplay);

        document.getElementById('random').addEventListener('click', randomExercise);

        document.getElementById('key').addEventListener('change', updateDisplay);

        document.getElementById('scale').addEventListener('change', updateDisplay);

        document.getElementById('pattern').addEventListener('change', updateDisplay);

        document.getElementById('position').addEventListener('change', updateDisplay);

        document.getElementById('direction').addEventListener('change', updateDisplay);

        document.getElementById('progression').addEventListener('change', updateDisplay);

        document.getElementById('run-notation-tests').addEventListener('click', runNotationTests);



        // Initial display

        updateDisplay();



        // Auto-run notation tests when URL hash is #test (e.g. file:///.../guitar-training.html#test)

        if (window.location.hash === '#test') {

            setTimeout(runNotationTests, 500);

        }

    </script>

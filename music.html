<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guitar Training Application</title>

    <style>

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }



        body {

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

            min-height: 100vh;

            padding: 20px;

            color: #333;

        }



        .container {

            max-width: 1400px;

            margin: 0 auto;

            background: white;

            border-radius: 20px;

            box-shadow: 0 20px 60px rgba(0,0,0,0.3);

            padding: 30px;

        }



        h1 {

            text-align: center;

            color: #667eea;

            margin-bottom: 30px;

            font-size: 2.5em;

        }



        .controls {

            display: grid;

            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));

            gap: 20px;

            margin-bottom: 30px;

            padding: 20px;

            background: #f8f9fa;

            border-radius: 10px;

        }



        .control-group {

            display: flex;

            flex-direction: column;

        }



        .control-group label {

            font-weight: bold;

            margin-bottom: 8px;

            color: #555;

        }



        .control-group select,

        .control-group button {

            padding: 10px;

            border: 2px solid #ddd;

            border-radius: 5px;

            font-size: 16px;

            background: white;

            cursor: pointer;

        }



        .control-group select:hover,

        .control-group button:hover {

            border-color: #667eea;

        }



        .control-group button {

            background: #667eea;

            color: white;

            border: none;

            font-weight: bold;

            transition: background 0.3s;

        }



        .control-group button:hover {

            background: #5568d3;

        }



        .scale-info {

            background: #e8f4f8;

            padding: 20px;

            border-radius: 10px;

            margin-bottom: 30px;

            border-left: 5px solid #667eea;

        }



        .scale-info h2 {

            color: #667eea;

            margin-bottom: 10px;

        }



        .scale-alterations {

            font-size: 1.2em;

            font-weight: bold;

            color: #555;

            margin-top: 10px;

        }



        .exercise-info {

            background: #fff3cd;

            padding: 20px;

            border-radius: 10px;

            margin-bottom: 30px;

            border-left: 5px solid #ffc107;

        }



        .exercise-info h2 {

            color: #856404;

            margin-bottom: 10px;

        }



        .exercise-details {

            display: grid;

            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));

            gap: 15px;

            margin-top: 15px;

        }



        .exercise-detail {

            padding: 10px;

            background: white;

            border-radius: 5px;

            border: 1px solid #ffc107;

        }



        .exercise-detail strong {

            color: #856404;

        }



        .fretboard-container {

            overflow-x: auto;

            margin-bottom: 30px;

            padding: 20px;

            background: #f8f9fa;

            border-radius: 10px;

        }



        .fretboard {

            display: flex;

            flex-direction: column;

            gap: 8px;

            min-width: 800px;

            margin: 0 auto;

        }



        .string {

            display: flex;

            align-items: center;

            position: relative;

        }



        .string-label {

            width: 40px;

            font-weight: bold;

            text-align: center;

            color: #555;

        }



        .frets {

            display: flex;

            flex: 1;

            position: relative;

        }



        .fret {

            flex: 1;

            height: 50px;

            border-right: 3px solid #333;

            display: flex;

            align-items: center;

            justify-content: center;

            position: relative;

            background: #fafafa;

        }



        .fret:first-child {

            border-left: 3px solid #333;

        }



        .fret-label {

            position: absolute;

            top: -25px;

            left: 50%;

            transform: translateX(-50%);

            font-size: 12px;

            color: #666;

            font-weight: bold;

        }



        .note {

            width: 35px;

            height: 35px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-weight: bold;

            font-size: 14px;

            color: white;

            cursor: pointer;

            transition: transform 0.2s;

        }



        .note:hover {

            transform: scale(1.1);

        }



        .note.root {

            background: #dc3545;

        }



        .note.scale {

            background: #667eea;

        }



        .note.exercise {

            background: #28a745;

            border: 3px solid #155724;

        }



        .note.exercise.root {

            background: #ffc107;

            border: 3px solid #856404;

            color: #333;

        }



        .fret-number {

            position: absolute;

            bottom: -20px;

            left: 50%;

            transform: translateX(-50%);

            font-size: 11px;

            color: #999;

        }



        .notes-display {

            margin-top: 20px;

            padding: 15px;

            background: white;

            border-radius: 5px;

            border: 1px solid #ddd;

        }



        .notes-display h3 {

            margin-bottom: 10px;

            color: #667eea;

        }



        .notes-list {

            overflow-x: auto;

            padding: 10px 0;

        }



        .notation-staff {

            display: block;

            min-width: min-content;

        }

    </style>

</head>

        </div>



        <div class="scale-info">

        <div class="fretboard-container">

            <div class="fretboard" id="fretboard"></div>

        </div>



        <div class="notes-display">

            <h3>Exercise Notes Sequence</h3>

            <div class="notes-list" id="notes-sequence"></div>

            <div id="notes-text" style="margin-top: 10px; font-family: monospace; font-size: 14px; color: #555; word-wrap: break-word;"></div>

        </div>



        <div class="notes-display" style="margin-top: 1em;">

            <h3>Notation tests</h3>

            <button type="button" id="run-notation-tests">Run notation tests</button>

            <pre id="notation-test-results" style="margin-top: 10px; padding: 10px; background: #f5f5f5; min-height: 40px;"></pre>

    <script src="https://cdn.jsdelivr.net/npm/vexflow@4/releases/vexflow-min.js"></script>

    <script>

        // Chromatic notes

        const chromaticNotes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

        

        // Standard guitar tuning (E2, A2, D3, G3, B3, E4)

        const guitarStrings = [

            { note: 'E', octave: 2, index: 4 },

            { note: 'A', octave: 2, index: 9 },

            { note: 'D', octave: 3, index: 2 },

            { note: 'G', octave: 3, index: 7 },

            { note: 'B', octave: 3, index: 11 },

            { note: 'E', octave: 4, index: 4 }

        ];



        // Scale definitions with alterations

        const scales = {

            'major': {

                name: 'Major (Ionian)',

                intervals: [0, 2, 4, 5, 7, 9, 11],

                alterations: '1 2 3 4 5 6 7'

            },

            'dorian': {

                name: 'Dorian',

                intervals: [0, 2, 3, 5, 7, 9, 10],

                alterations: '1 2 b3 4 5 6 b7'

            },

            'phrygian': {

                name: 'Phrygian',

                intervals: [0, 1, 3, 5, 7, 8, 10],

                alterations: '1 b2 b3 4 5 b6 b7'

            },

            'lydian': {

                name: 'Lydian',

                intervals: [0, 2, 4, 6, 7, 9, 11],

                alterations: '1 2 3 #4 5 6 7'

            },

            'mixolydian': {

                name: 'Mixolydian',

                intervals: [0, 2, 4, 5, 7, 9, 10],

                alterations: '1 2 3 4 5 6 b7'

            },

            'aeolian': {

                name: 'Aeolian (Natural Minor)',

                intervals: [0, 2, 3, 5, 7, 8, 10],

                alterations: '1 2 b3 4 5 b6 b7'

            },

            'locrian': {

                name: 'Locrian',

                intervals: [0, 1, 3, 5, 6, 8, 10],

                alterations: '1 b2 b3 4 b5 b6 b7'

            },

            'harmonic-minor': {

                name: 'Harmonic Minor',

                intervals: [0, 2, 3, 5, 7, 8, 11],

                alterations: '1 2 b3 4 5 b6 7'

            },

            'melodic-minor': {

                name: 'Melodic Minor',

                intervals: [0, 2, 3, 5, 7, 9, 11],

                alterations: '1 2 b3 4 5 6 7'

            },

            'lydian-dominant': {

                name: 'Lydian Dominant',

                intervals: [0, 2, 4, 6, 7, 9, 10],

                alterations: '1 2 3 #4 5 6 b7'

            },

            'phrygian-dominant': {

                name: 'Phrygian Dominant',

                intervals: [0, 1, 4, 5, 7, 8, 10],

                alterations: '1 b2 3 4 5 b6 b7'

            },

            'altered': {

                name: 'Altered (Super Locrian)',

                intervals: [0, 1, 3, 4, 6, 8, 10],

                alterations: '1 b2 b3 b4 b5 b6 b7'

            },

            'bebop-dominant': {

                name: 'Bebop Dominant',

                intervals: [0, 2, 4, 5, 7, 9, 10, 11],

                alterations: '1 2 3 4 5 6 b7 7'

            },

            'bebop-major': {

                name: 'Bebop Major',

                intervals: [0, 2, 4, 5, 7, 8, 9, 11],

                alterations: '1 2 3 4 5 b6 6 7'

            },

            'diminished-wh': {

                name: 'Diminished (Whole-Half)',

                intervals: [0, 2, 3, 5, 6, 8, 9, 11],

                alterations: '1 2 b3 4 b5 b6 6 7'

            },

            'diminished-hw': {

                name: 'Diminished (Half-Whole)',

                intervals: [0, 1, 3, 4, 6, 7, 9, 10],

                alterations: '1 b2 b3 3 #4 5 6 b7'

            },

            'blues': {

                name: 'Blues',

                intervals: [0, 3, 5, 6, 7, 10],

                alterations: '1 b3 4 b5 5 b7'

            },

            'whole-tone': {

                name: 'Whole Tone',

                intervals: [0, 2, 4, 6, 8, 10],

                alterations: '1 2 3 #4 #5 #6'

            },

            'pentatonic-major': {

                name: 'Pentatonic Major',

                intervals: [0, 2, 4, 7, 9],

                alterations: '1 2 3 5 6'

            },

            'pentatonic-minor': {

                name: 'Pentatonic Minor',

                intervals: [0, 3, 5, 7, 10],

                alterations: '1 b3 4 5 b7'

            }

        };



        // Get note name from chromatic index

        function getNoteName(index) {

            return chromaticNotes[index % 12];

        }



        // Get chromatic index from note name

        function getNoteIndex(note) {

            return chromaticNotes.indexOf(note);

        }



        // Assign octaves to a sequence of note names using nearest-neighbor MIDI distance.
        // For each note, pick the octave (within [3,6]) that minimises the semitone
        // interval from the previous note, so any melodic interval works correctly.

        function assignOctavesToSequence(noteNames, rootKey) {

            if (noteNames.length === 0) return [];

            const out = [];

            let octave = 4;

            for (let i = 0; i < noteNames.length; i++) {

                if (i === 0) {

                    out.push({ name: noteNames[i], octave });

                } else {

                    const prevMidi = toMidi(out[i - 1].name, out[i - 1].octave);

                    let bestOctave = octave;

                    let bestDist = Infinity;

                    for (const cand of [octave - 1, octave, octave + 1]) {

                        if (cand < 3 || cand > 6) continue;

                        const dist = Math.abs(toMidi(noteNames[i], cand) - prevMidi);

                        if (dist < bestDist) { bestDist = dist; bestOctave = cand; }

                    }

                    octave = bestOctave;

                    out.push({ name: noteNames[i], octave });

                }

            }

            return out;

        }



        // (noteName, octave) -> MIDI number (C4 = 60)

        function toMidi(name, octave) {

            return 60 + (octave - 4) * 12 + getNoteIndex(name);

        }



        // Build a linear (multi-octave) scale as {name,octave}[] starting at startOctave.
        // numPasses copies of the scale are appended, octave incrementing at each C (or
        // wherever the chromatic index wraps downward).

        function buildLinearScale(scaleNotes, startOctave, numPasses) {

            const result = [];

            let octave = startOctave;

            for (let pass = 0; pass < numPasses; pass++) {

                for (let j = 0; j < scaleNotes.length; j++) {

                    if (result.length > 0) {

                        const prevChrom = getNoteIndex(result[result.length - 1].name);

                        const curChrom  = getNoteIndex(scaleNotes[j]);

                        if (curChrom <= prevChrom) octave++;

                    }

                    result.push({ name: scaleNotes[j], octave });

                }

            }

            return result;

        }



        // Generate scale notes for a given key and scale

        function generateScale(key, scaleType) {

            const scale = scales[scaleType];

            const rootIndex = getNoteIndex(key);

            return scale.intervals.map(interval => getNoteName(rootIndex + interval));

        }



        // Find notes on fretboard within a position

        function findNotesOnFretboard(key, scaleType, position) {

            const scaleNotes = generateScale(key, scaleType);

            const notes = [];

            const startFret = (position - 1) * 4;

            const endFret = startFret + 12;



            guitarStrings.forEach((string, stringIndex) => {

                for (let fret = startFret; fret <= endFret && fret <= 24; fret++) {

                    const noteIndex = (string.index + fret) % 12;

                    const noteName = chromaticNotes[noteIndex];

                    if (scaleNotes.includes(noteName)) {

                        notes.push({

                            string: stringIndex,

                            fret: fret,

                            note: noteName,

                            isRoot: noteName === key

                        });

                    }

                }

            });



            return notes;

        }



        // Generate exercise pattern

        function generateExercisePattern(scaleNotes, pattern, direction, progression) {

            let result;

            // Handle all 8 combinations of direction × progression
            switch (pattern) {

                case '3-note':
                case '4-note':
                case '6-note': {

                    const groupSize = pattern === '4-note' ? 4 : pattern === '6-note' ? 6 : 3;

                    result = generateScaleRunCells(scaleNotes, groupSize, direction, progression);

                    break;

                }

                case 'triads': {

                    result = generateTriadCells(scaleNotes, direction, progression);

                    break;

                }

                case 'thirds': {

                    result = generateThirdCells(scaleNotes, direction, progression);

                    break;

                }

                case 'chords': {

                    result = generateChordCells(scaleNotes, direction, progression);

                    break;

                }

                case 'arpeggios': {

                    result = generateArpeggioCells(scaleNotes, direction, progression);

                    break;

                }

                case 'pivot-arpeggios': {

                    result = generatePivotArpeggioCells(scaleNotes, direction, progression);

                    break;

                }

                case 'melodic-cells': {

                    result = generateMelodicCellLine(scaleNotes);

                    break;

                }

                default:

                    result = scaleNotes.slice();

            }

            return result;

        }



        // ===== New cell-based generators (handle all 8 direction × progression combinations) =====

        function generateScaleRunCells(scaleNotes, groupSize, direction, progression) {

            const len = scaleNotes.length;

            const extended = [...scaleNotes, ...scaleNotes, ...scaleNotes];

            const result = [];

            const isAlternating = direction === 'forward-backward-alt' || direction === 'backward-forward-alt';

            const isForwardFirst = direction === 'forward-backward-alt';

            // Down starts with the highest cell that fits inside the octave (top note = top degree)
            const startIdx = progression === 'up' ? 0 : Math.max(0, len - groupSize);

            const step = progression === 'up' ? 1 : -1;



            if (isAlternating) {

                for (let i = 0; i < len; i++) {

                    const idx = (startIdx + i * step + len * 100) % len;

                    if ((isForwardFirst && i % 2 === 0) || (!isForwardFirst && i % 2 === 1)) {

                        // Forward cell: ascending
                        for (let k = 0; k < groupSize; k++) {

                            result.push(extended[idx + k]);

                        }

                    } else {

                        // Backward cell: descending from idx+groupSize-1 down to idx
                        for (let k = groupSize - 1; k >= 0; k--) {

                            result.push(extended[idx + k]);

                        }

                    }

                }

            } else {

                const isBackward = direction === 'backward';

                for (let i = 0; i < len; i++) {

                    const idx = (startIdx + i * step + len * 100) % len;



                    if (isBackward) {

                        // Backward cell: descending from idx+groupSize-1 down to idx
                        for (let k = groupSize - 1; k >= 0; k--) {

                            result.push(extended[idx + k]);

                        }

                    } else {

                        // Forward cell: ascending
                        for (let k = 0; k < groupSize; k++) {

                            result.push(extended[idx + k]);

                        }

                    }

                }

            }

            return result;

        }



        function generateThirdCells(scaleNotes, direction, progression) {

            const len = scaleNotes.length;

            const result = [];

            const isAlternating = direction === 'forward-backward-alt' || direction === 'backward-forward-alt';

            const isForwardFirst = direction === 'forward-backward-alt';

            // Down starts with the highest cell that fits inside the octave (cell spans idx..idx+2)
            const startIdx = progression === 'up' ? 0 : Math.max(0, len - 3);

            const step = progression === 'up' ? 1 : -1;



            if (isAlternating) {

                for (let i = 0; i < len; i++) {

                    const cellType = (isForwardFirst && i % 2 === 0) || (!isForwardFirst && i % 2 === 1) ? 'fwd' : 'bwd';

                    const idx = (startIdx + i * step + len * 100) % len;



                    if (cellType === 'fwd') {

                        result.push(scaleNotes[idx]);

                        result.push(scaleNotes[(idx + 2) % len]);

                    } else {

                        result.push(scaleNotes[(idx + 2) % len]);

                        result.push(scaleNotes[idx]);

                    }

                }

            } else {

                const isBackward = direction === 'backward';

                for (let i = 0; i < len; i++) {

                    const idx = (startIdx + i * step + len * 100) % len;



                    if (isBackward) {

                        result.push(scaleNotes[(idx + 2) % len]);

                        result.push(scaleNotes[idx]);

                    } else {

                        result.push(scaleNotes[idx]);

                        result.push(scaleNotes[(idx + 2) % len]);

                    }

                }

            }

            return result;

        }



        function generateTriadCells(scaleNotes, direction, progression) {

            const linear = buildLinearScale(scaleNotes, 4, 2);

            const len = scaleNotes.length;

            const result = [];

            const isAlternating = direction === 'forward-backward-alt' || direction === 'backward-forward-alt';

            const isForwardFirst = direction === 'forward-backward-alt';

            const startIdx = progression === 'up' ? 0 : len - 1;

            const step = progression === 'up' ? 1 : -1;



            if (isAlternating) {

                for (let i = 0; i < len; i++) {

                    const cellType = (isForwardFirst && i % 2 === 0) || (!isForwardFirst && i % 2 === 1) ? 'fwd' : 'bwd';

                    const idx = (startIdx + i * step + len * 100) % len;



                    if (cellType === 'fwd') {

                        result.push(linear[idx]);

                        result.push(linear[idx + 2]);

                        result.push(linear[idx + 4]);

                    } else {

                        result.push(linear[idx + 4]);

                        result.push(linear[idx + 2]);

                        result.push(linear[idx]);

                    }

                }

            } else {

                const isBackward = direction === 'backward';

                for (let i = 0; i < len; i++) {

                    const idx = (startIdx + i * step + len * 100) % len;



                    if (isBackward) {

                        result.push(linear[idx + 4]);

                        result.push(linear[idx + 2]);

                        result.push(linear[idx]);

                    } else {

                        result.push(linear[idx]);

                        result.push(linear[idx + 2]);

                        result.push(linear[idx + 4]);

                    }

                }

            }

            return result;

        }



        function generateChordCells(scaleNotes, direction, progression) {

            const linear = buildLinearScale(scaleNotes, 4, 3);

            const len = scaleNotes.length;

            const result = [];

            const isAlternating = direction === 'forward-backward-alt' || direction === 'backward-forward-alt';

            const isForwardFirst = direction === 'forward-backward-alt';

            const startIdx = progression === 'up' ? 0 : len - 1;

            const step = progression === 'up' ? 1 : -1;



            if (isAlternating) {

                for (let i = 0; i < len; i++) {

                    const cellType = (isForwardFirst && i % 2 === 0) || (!isForwardFirst && i % 2 === 1) ? 'fwd' : 'bwd';

                    const idx = (startIdx + i * step + len * 100) % len;



                    if (cellType === 'fwd') {

                        result.push(linear[idx], linear[idx+2], linear[idx+4], linear[idx+6]);

                    } else {

                        result.push(linear[idx+6], linear[idx+4], linear[idx+2], linear[idx]);

                    }

                }

            } else {

                const isBackward = direction === 'backward';

                for (let i = 0; i < len; i++) {

                    const idx = (startIdx + i * step + len * 100) % len;



                    if (isBackward) {

                        result.push(linear[idx+6], linear[idx+4], linear[idx+2], linear[idx]);

                    } else {

                        result.push(linear[idx], linear[idx+2], linear[idx+4], linear[idx+6]);

                    }

                }

            }

            return result;

        }



        function generateArpeggioCells(scaleNotes, direction, progression) {

            const linear = buildLinearScale(scaleNotes, 4, 3);

            const len = scaleNotes.length;

            const result = [];

        function generatePivotArpeggioCells(scaleNotes, direction, progression) {

            const len = scaleNotes.length;

            const linear = buildLinearScale(scaleNotes, 4, 3);

            const result = [];

            const isAlternating = direction === 'forward-backward-alt' || direction === 'backward-forward-alt';

            const isForwardFirst = direction === 'forward-backward-alt';

            const startIdx = progression === 'up' ? 0 : len - 1;

            const step = progression === 'up' ? 1 : -1;



            if (isAlternating) {

                for (let i = 0; i < len; i++) {

                    const cellType = (isForwardFirst && i % 2 === 0) || (!isForwardFirst && i % 2 === 1) ? 'fwd' : 'bwd';

                    const idx = (startIdx + i * step + len * 100) % len;



                    if (cellType === 'fwd') {

                        result.push(linear[idx + len], linear[idx + 2], linear[idx + 4], linear[idx + 6]);

                    } else {

                        result.push(linear[idx], linear[idx + len - 1], linear[idx + len - 3], linear[idx + len - 5]);

        // ===== Melodic cell mode =====
        // Randomly stitches integer-beat cells (scale steps, thirds/arpeggio skips,
        // Barry Harris-style chromatic approaches) so that a chord tone (scale degree
        // 1/3/5/7) lands on every downbeat. The line is padded with leading rests so
        // it fills whole 4/4 measures and ends on the root as a quarter note.

        function midiToNote(midi) {

            return { name: chromaticNotes[((midi % 12) + 12) % 12], octave: Math.floor(midi / 12) - 1 };

        }



        function generateMelodicCellLine(scaleNotes) {

            const len = scaleNotes.length;

            const linear = buildLinearScale(scaleNotes, 3, 6);

            const isChordTone = (idx) => {

                const deg = ((idx % len) + len) % len;

                return deg % 2 === 0 && deg <= 6;

            };

            const inRange = (idx) => idx >= 2 && idx <= linear.length - 3;



            // Cell builders: each returns { notes, landIdx } for `beats` beats
            // (2 eighth notes per beat) starting at chord tone startIdx, or null
            // if it can't satisfy the downbeat-chord-tone rule.
            function scaleCell(startIdx, beats, dir) {

                const notes = [];

                for (let t = 0; t < beats * 2; t++) {

                    const idx = startIdx + t * dir;

                    if (!inRange(idx)) return null;

                    if (t % 2 === 0 && !isChordTone(idx)) return null;

                    notes.push(linear[idx]);

                }

                const landIdx = startIdx + beats * 2 * dir;

                if (!inRange(landIdx) || !isChordTone(landIdx)) return null;

                return { notes, landIdx };

            }



            function skipCell(startIdx, beats, dir) {

                // Moves in diatonic thirds: every eighth note skips one degree.
                const notes = [];

                for (let t = 0; t < beats * 2; t++) {

                    const idx = startIdx + t * 2 * dir;

                    if (!inRange(idx)) return null;

                    if (t % 2 === 0 && !isChordTone(idx)) return null;

                    notes.push(linear[idx]);

                }

                const landIdx = startIdx + beats * 4 * dir;

                if (!inRange(landIdx) || !isChordTone(landIdx)) return null;

                return { notes, landIdx };

            }



            function chromaticCell(startIdx, dir) {

                // One beat: chord tone, then a Barry Harris-style chromatic approach
                // tone a half step beyond the next chord tone a third away.
                const landIdx = startIdx + 2 * dir;

                if (!inRange(landIdx) || !isChordTone(landIdx)) return null;

                const startMidi = toMidi(linear[startIdx].name, linear[startIdx].octave);

                const landMidi = toMidi(linear[landIdx].name, linear[landIdx].octave);

                if (Math.abs(landMidi - startMidi) < 2) return null;

                const passMidi = landMidi - dir; // half step above when descending, below when ascending

                return { notes: [linear[startIdx], midiToNote(passMidi)], landIdx };

            }



            function randomCell(startIdx) {

                const candidates = [];

                for (const dir of [1, -1]) {

                    for (const beats of [1, 2]) {

                        candidates.push(() => scaleCell(startIdx, beats, dir));

                        candidates.push(() => skipCell(startIdx, beats, dir));

                    }

                    candidates.push(() => chromaticCell(startIdx, dir));

                }

                // Shuffle, return first valid
                for (let i = candidates.length - 1; i > 0; i--) {

                    const j = Math.floor(Math.random() * (i + 1));

                    [candidates[i], candidates[j]] = [candidates[j], candidates[i]];

                }

                for (const make of candidates) {

                    const cell = make();

                    if (cell) return cell;

                }

                return null;

            }



            // Start on a random chord tone in the middle octave
            const chordToneDegrees = [];

            for (let d = 0; d < len; d++) if (d % 2 === 0 && d <= 6) chordToneDegrees.push(d);

            let idx = len + chordToneDegrees[Math.floor(Math.random() * chordToneDegrees.length)];



            const minBeats = 6;

            const maxBeats = 16;

            const line = [];

            let beats = 0;

            while (beats < maxBeats) {

                const cell = randomCell(idx);

                if (!cell) break;

                line.push(...cell.notes);

                beats += cell.notes.length / 2;

                idx = cell.landIdx;

                // Stop once we've landed on a root with enough material
                if (beats >= minBeats && ((idx % len) + len) % len === 0) break;

            }

            // If we ran out without landing on a root, walk down the scale until we do
            // (stepping a third per beat cycles through all degrees, so this terminates).
            let guard = 0;

            while (((idx % len) + len) % len !== 0 && guard++ < len + 1) {

                const cell = scaleCell(idx, 1, -1) || scaleCell(idx, 1, 1) || chromaticCell(idx, -1) || chromaticCell(idx, 1);

                if (!cell) break;

                line.push(...cell.notes);

                beats += cell.notes.length / 2;

                idx = cell.landIdx;

            }



            // Final root lands on the next downbeat as a quarter note
            const final = { name: linear[idx].name, octave: linear[idx].octave, duration: 'q' };



            // Pad the start with rests so the line fills whole 4/4 measures
            const totalBeats = beats + 1;

            let padBeats = (4 - (totalBeats % 4)) % 4;

            const rests = [];

            while (padBeats >= 2) {

                rests.push({ rest: true, duration: 'h' });

                padBeats -= 2;

            }

            while (padBeats >= 1) {

                rests.push({ rest: true, duration: 'q' });

                padBeats -= 1;

            }

            return [...rests, ...line, final];

        }



        // Render exercise with VexFlow. Accepts string[] (note names) or {name,octave}[]
        // (pivot arpeggios pass the latter to avoid nearest-neighbour octave errors).

        function renderNotation(container, noteInput, rootKey) {

            const notes = (noteInput.length > 0 && typeof noteInput[0] === 'object')

                ? noteInput

                : assignOctavesToSequence(noteInput, rootKey);

            if (notes.length === 0) return;

            const VF = typeof VexFlow !== 'undefined' ? VexFlow : (typeof Vex !== 'undefined' && Vex.Flow ? Vex.Flow : null);

            if (!VF) {

                container.innerHTML = '<p style="color:#856404;">VexFlow failed to load. Check network.</p>';

                return;

            }



            const vexId = 'vexflow-staff';

            container.innerHTML = '<div id="' + vexId + '"></div>';

            // Chunk into measures by ticks (1 tick = one eighth note; 8 per 4/4 bar).
            // Notes may carry a duration ('8' default, 'q', 'h') and/or rest flag.
            const TICKS_PER_MEASURE = 8;

            const durTicks = { '8': 1, 'q': 2, 'h': 4, 'w': 8 };

            const chunks = [];

            let current = [];

            let ticks = 0;

            for (const n of notes) {

                const t = durTicks[n.duration || '8'] || 1;

                current.push(n);

                ticks += t;

                if (ticks >= TICKS_PER_MEASURE) {

                    chunks.push(current);

                    current = [];

                    ticks = 0;

                }

            }

            if (current.length > 0) chunks.push(current);

            // Layout constants
            const X_START = 10;
            const Y_START = 40;
            const FIRST_W = 260;
            const MEASURE_W = 210;
            const MEASURES_PER_LINE = 4;
            const LINE_H = 100;

            const numLines = Math.ceil(chunks.length / MEASURES_PER_LINE);
            const measuresOnFirstLine = Math.min(chunks.length, MEASURES_PER_LINE);
            const totalWidth = X_START + FIRST_W + (measuresOnFirstLine - 1) * MEASURE_W + X_START;
            const totalHeight = Y_START + numLines * LINE_H + 20;

            try {

                const { Factory, Beam } = VF;

                const vf = new Factory({ renderer: { elementId: vexId, width: Math.max(500, totalWidth), height: totalHeight } });

                const score = vf.EasyScore();

                const allBeams = [];

                chunks.forEach((chunk, chunkIdx) => {

                    const lineNum = Math.floor(chunkIdx / MEASURES_PER_LINE);

                    const posInLine = chunkIdx % MEASURES_PER_LINE;

                    const isFirstInLine = posInLine === 0;

                    const x = X_START + (isFirstInLine ? 0 : FIRST_W + (posInLine - 1) * MEASURE_W);

                    const y = Y_START + lineNum * LINE_H;

                    const w = isFirstInLine ? FIRST_W : MEASURE_W;

                    const system = vf.System({ x, y, width: w });

                    let noteStr = chunk.map(n => {

                        const dur = n.duration || '8';

                        return n.rest ? ('B4/' + dur + '/r') : (n.name + n.octave + '/' + dur);

                    }).join(', ');

                    const usedTicks = chunk.reduce((s, n) => s + (durTicks[n.duration || '8'] || 1), 0);

                    const need = TICKS_PER_MEASURE - usedTicks;

                    if (need > 0) {

                        noteStr += (noteStr ? ', ' : '') + Array(need).fill('B4/8/r').join(', ');

                    }

                    const staveNotes = score.notes(noteStr, { stem: 'auto' });

                    const voice = score.voice(staveNotes, { time: '4/4' });

                    const stave = system.addStave({ voices: [voice] });

                    if (isFirstInLine) {

                        stave.addClef('treble').addTimeSignature('4/4');

                    }

                    // Beam eighth notes in groups of 4 (one beat per beam in 4/4)
                    if (Beam) {

                        Beam.generateBeams(staveNotes).forEach(b => allBeams.push(b));

                    }

                });

                vf.draw();

                // Beams must be drawn after vf.draw() has positioned the notes
                const ctx = vf.getContext();

                allBeams.forEach(b => b.setContext(ctx).draw());

            } catch (err) {

                container.innerHTML = '<p style="color:#856404;">Notation error: ' + (err.message || err) + '</p>';

            }

        }



        // ---------- Notation tests ----------

        function runNotationTests() {

            }



            const C_MAJOR = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];

                assert(noError2, '8 notes: no "Too many ticks" or "Notation error"');

                assert(hasContent2, '8 notes: notation rendered');



                // Test 3: 24 notes (three full measures)

                container.innerHTML = '';

                renderNotation(container, makeNotes(24), 'C');

                const noError3 = container.textContent.indexOf('Too many ticks') === -1 && container.textContent.indexOf('Notation error') === -1;

                const hasContent3 = container.querySelector('#vexflow-staff') && container.querySelector('#vexflow-staff').children.length > 0;

                assert(noError3, '24 notes: no "Too many ticks" or "Notation error"');

                assert(hasContent3, '24 notes: notation rendered');



                // Test 4: 7 notes (incomplete last measure, should pad with rest)

                container.innerHTML = '';

                renderNotation(container, makeNotes(7), 'C');

                const noError4 = container.textContent.indexOf('Too many ticks') === -1 && container.textContent.indexOf('Notation error') === -1;

                const hasContent4 = container.querySelector('#vexflow-staff') && container.querySelector('#vexflow-staff').children.length > 0;

                assert(noError4, '7 notes (incomplete measure): no error');

                assert(hasContent4, '7 notes: notation rendered');



                // Test 5: melodic cell line (mixed durations and rests)

                container.innerHTML = '';

                renderNotation(container, generateMelodicCellLine(C_MAJOR), 'C');

                const noError5 = container.textContent.indexOf('Too many ticks') === -1 && container.textContent.indexOf('Notation error') === -1;

                const hasContent5 = container.querySelector('#vexflow-staff') && container.querySelector('#vexflow-staff').children.length > 0;

                assert(noError5, 'melodic cells: no error');

                assert(hasContent5, 'melodic cells: notation rendered');

            } finally {

                document.body.removeChild(container);

            }



            results.unshift(passed + ' passed, ' + failed + ' failed');

            out.textContent = results.join('\n');

        }



        // Render fretboard

        function renderFretboard(key, scaleType, position, exerciseNotes) {

            const fretboard = document.getElementById('fretboard');

            fretboard.innerHTML = '';



            const scaleNotes = generateScale(key, scaleType);

            const fretboardNotes = findNotesOnFretboard(key, scaleType, position);

            const startFret = (position - 1) * 4;

            const endFret = Math.min(startFret + 12, 24);



            // Create fret labels

            const fretLabels = document.createElement('div');

            fretLabels.className = 'frets';

            fretLabels.style.marginBottom = '20px';

                label.className = 'fret-label';

                label.textContent = f;

                label.style.position = 'absolute';

                label.style.left = `${((f - startFret) / (endFret - startFret + 1)) * 100}%`;

            // Create strings

                    const noteIndex = (string.index + fret) % 12;

                    const noteName = chromaticNotes[noteIndex];

                    const isInScale = scaleNotes.includes(noteName);

                    const isInExercise = exerciseNotes && exerciseNotes.includes(noteName);



                    if (isInScale || isInExercise) {

                        const noteDiv = document.createElement('div');

                            }

                        }

                stringDiv.appendChild(fretsDiv);

                fretboard.appendChild(stringDiv);

        }

        function getOrdinalSuffix(num) {

            const j = num % 10;

            const k = num % 100;

            if (j === 1 && k !== 11) return 'st';

            if (j === 2 && k !== 12) return 'nd';

            if (j === 3 && k !== 13) return 'rd';

            return 'th';

        }



        // ===== Playback (WebAudio) =====

        let currentPlayback = [];

        let audioCtx = null;

        let playbackTimer = null;



        function stopPlayback() {

            if (playbackTimer) {

                clearTimeout(playbackTimer);

                playbackTimer = null;

            }

            document.getElementById('play').textContent = '▶ Play';

        }



        function startPlayback() {

            if (playbackTimer) {

                stopPlayback();

                return;

            }

            if (currentPlayback.length === 0) return;

            if (!audioCtx) {

                audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            }

            if (audioCtx.state === 'suspended') audioCtx.resume();

            const bpm = parseInt(document.getElementById('tempo').value);

            const eighth = 60 / bpm / 2;

            const durBeats = { '8': 1, 'q': 2, 'h': 4, 'w': 8 };

            document.getElementById('play').textContent = '■ Stop';

            let i = 0;

            function playNext() {

                if (i >= currentPlayback.length) {

                    stopPlayback();

                    return;

                }

                const n = currentPlayback[i++];

                const ticks = durBeats[n.duration || '8'] || 1;

                const dur = ticks * eighth;

                if (!n.rest) {

                    const osc = audioCtx.createOscillator();

                    const gain = audioCtx.createGain();

                    osc.type = 'triangle';

                    osc.frequency.value = 440 * Math.pow(2, (toMidi(n.name, n.octave) - 69) / 12);

                    const t0 = audioCtx.currentTime;

                    gain.gain.setValueAtTime(0.001, t0);

                    gain.gain.exponentialRampToValueAtTime(0.4, t0 + 0.01);

                    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur * 0.9);

                    osc.connect(gain).connect(audioCtx.destination);

                    osc.start(t0);

                    osc.stop(t0 + dur);

                }

                playbackTimer = setTimeout(playNext, dur * 1000);

            }

            playNext();

        }



        function randomExercise() {

            const keys = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

            const scaleTypes = Object.keys(scales);

            const patterns = ['3-note', '4-note', '6-note', 'thirds', 'triads', 'chords', 'arpeggios', 'pivot-arpeggios', 'melodic-cells'];

            const positions = [1, 2, 3];

            const directions = ['forward', 'backward', 'forward-backward-alt', 'backward-forward-alt'];

            const progressions = ['up', 'down'];



            document.getElementById('key').value = keys[Math.floor(Math.random() * keys.length)];

            document.getElementById('scale').value = scaleTypes[Math.floor(Math.random() * scaleTypes.length)];

            document.getElementById('pattern').value = patterns[Math.floor(Math.random() * patterns.length)];

            document.getElementById('position').value = positions[Math.floor(Math.random() * positions.length)];

            document.getElementById('direction').value = directions[Math.floor(Math.random() * directions.length)];

            document.getElementById('progression').value = progressions[Math.floor(Math.random() * progressions.length)];



            updateDisplay();

        }



        // Event listeners

        document.getElementById('generate').addEventListener('click', updateDisplay);

        document.getElementById('random').addEventListener('click', randomExercise);

        document.getElementById('key').addEventListener('change', updateDisplay);

        document.getElementById('scale').addEventListener('change', updateDisplay);

        document.getElementById('pattern').addEventListener('change', updateDisplay);

        document.getElementById('position').addEventListener('change', updateDisplay);

        document.getElementById('direction').addEventListener('change', updateDisplay);

        document.getElementById('progression').addEventListener('change', updateDisplay);

        document.getElementById('run-notation-tests').addEventListener('click', runNotationTests);

        document.getElementById('play').addEventListener('click', startPlayback);

        document.getElementById('tempo').addEventListener('input', function () {

            document.getElementById('tempo-value').textContent = this.value;

        });



        // Keyboard shortcuts: g = generate, r = random, p = play/stop

        document.addEventListener('keydown', function (e) {

            if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;

            if (e.key === 'g') updateDisplay();

            else if (e.key === 'r') randomExercise();

            else if (e.key === 'p') startPlayback();

        });



        // Initial display

        updateDisplay();



        // Auto-run notation tests when URL hash is #test (e.g. file:///.../guitar-training.html#test)

        if (window.location.hash === '#test') {

            setTimeout(runNotationTests, 500);

        }

    </script>

</body>

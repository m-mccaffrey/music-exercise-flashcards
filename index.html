<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Exercise Flashcards</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container">
    <header class="top">
        <h1>Music Exercise Flashcards</h1>
        <div class="segmented" role="tablist" aria-label="Mode">
            <button type="button" role="tab" data-mode="auto" aria-selected="true">Auto</button>
            <button type="button" role="tab" data-mode="manual" aria-selected="false">Manual</button>
        </div>
    </header>

    <section id="auto-panel" class="panel">
        <div class="segmented levels" role="radiogroup" aria-label="Difficulty">
            <button type="button" data-level="easy">Easy</button>
            <button type="button" data-level="medium">Medium</button>
            <button type="button" data-level="hard">Hard</button>
            <button type="button" data-level="pro">Pro</button>
        </div>
        <p id="level-description" class="muted"></p>
    </section>

    <section id="manual-panel" class="panel controls" hidden>
        <label>Key <select id="key"></select></label>
        <label>Scale / Mode <select id="scale"></select></label>
        <label>Pattern <select id="pattern"></select></label>
        <label>Direction <select id="direction"></select></label>
        <label>Progression <select id="progression"></select></label>
        <button type="button" id="random" class="secondary">Random</button>
    </section>

    <section class="card" aria-live="polite">
        <div class="card-head">
            <div>
                <h2 id="card-title">–</h2>
                <div id="card-formula" class="formula"></div>
            </div>
            <div id="card-tags" class="tags"></div>
        </div>
        <div id="notation" class="notation"></div>
        <div id="notes-text" class="notes-text"></div>
    </section>

    <section class="transport">
        <button type="button" id="next" class="primary">Next card <kbd>Space</kbd></button>
        <button type="button" id="play">▶ Play <kbd>P</kbd></button>
        <label class="tempo">Tempo <input type="range" id="tempo" min="40" max="240" value="80" step="4"> <output id="tempo-value">80</output> BPM</label>
        <label class="check"><input type="checkbox" id="loop"> Loop</label>
    </section>

    <details class="fretboard-details">
        <summary>Fretboard</summary>
        <div class="fretboard-wrap"><div id="fretboard" class="fretboard"></div></div>
    </details>
</main>

<script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.5/build/cjs/vexflow.js"></script>
<script src="js/theory.js"></script>
<script src="js/notation.js"></script>
<script src="js/app.js"></script>
</body>
</html>
